services:
  autolava-api:
    image: ${AUTOLAVA_API_IMAGE:-autolava-api:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AUTOLAVA_ENVIRONMENT: production
      AUTOLAVA_DATABASE_PATH: /data/autolava.sqlite3
      AUTOLAVA_BACKUP_DIRECTORY: /data/backups
      AUTOLAVA_JWT_SECRET: ${AUTOLAVA_JWT_SECRET:?set a random production JWT secret}
      AUTOLAVA_COOKIE_SECURE: ${AUTOLAVA_COOKIE_SECURE:-true}
      AUTOLAVA_BOOTSTRAP_USERNAME: ${AUTOLAVA_BOOTSTRAP_USERNAME}
      AUTOLAVA_BOOTSTRAP_PASSWORD: ${AUTOLAVA_BOOTSTRAP_PASSWORD}
      AUTOLAVA_MODEL_ADAPTER: ${AUTOLAVA_MODEL_ADAPTER:-fake}
      AUTOLAVA_MODEL_PROVIDER: ${AUTOLAVA_MODEL_PROVIDER:-primary}
      AUTOLAVA_MODEL_BASE_URL: ${AUTOLAVA_MODEL_BASE_URL:-}
      AUTOLAVA_MODEL_ID: ${AUTOLAVA_MODEL_ID:-}
      AUTOLAVA_MODEL_STRUCTURED_OUTPUT_METHOD: ${AUTOLAVA_MODEL_STRUCTURED_OUTPUT_METHOD:-json_schema}
      AUTOLAVA_MODEL_THINKING_PARAMETERS: "${AUTOLAVA_MODEL_THINKING_PARAMETERS:-{}}"
      AUTOLAVA_MODEL_TIMEOUT_SECONDS: ${AUTOLAVA_MODEL_TIMEOUT_SECONDS:-30}
      AUTOLAVA_MODEL_MAX_OUTPUT_TOKENS: ${AUTOLAVA_MODEL_MAX_OUTPUT_TOKENS:-2000}
      AUTOLAVA_MODEL_INPUT_COST_PER_MILLION: ${AUTOLAVA_MODEL_INPUT_COST_PER_MILLION:-0}
      AUTOLAVA_MODEL_OUTPUT_COST_PER_MILLION: ${AUTOLAVA_MODEL_OUTPUT_COST_PER_MILLION:-0}
      AUTOLAVA_MODEL_API_KEY: ${AUTOLAVA_MODEL_API_KEY:-}
      AUTOLAVA_FALLBACK_MODEL_PROVIDER: ${AUTOLAVA_FALLBACK_MODEL_PROVIDER:-fallback}
      AUTOLAVA_FALLBACK_MODEL_BASE_URL: ${AUTOLAVA_FALLBACK_MODEL_BASE_URL:-}
      AUTOLAVA_FALLBACK_MODEL_ID: ${AUTOLAVA_FALLBACK_MODEL_ID:-}
      AUTOLAVA_FALLBACK_MODEL_STRUCTURED_OUTPUT_METHOD: ${AUTOLAVA_FALLBACK_MODEL_STRUCTURED_OUTPUT_METHOD:-json_schema}
      AUTOLAVA_FALLBACK_MODEL_THINKING_PARAMETERS: "${AUTOLAVA_FALLBACK_MODEL_THINKING_PARAMETERS:-{}}"
      AUTOLAVA_FALLBACK_MODEL_INPUT_COST_PER_MILLION: ${AUTOLAVA_FALLBACK_MODEL_INPUT_COST_PER_MILLION:-0}
      AUTOLAVA_FALLBACK_MODEL_OUTPUT_COST_PER_MILLION: ${AUTOLAVA_FALLBACK_MODEL_OUTPUT_COST_PER_MILLION:-0}
      AUTOLAVA_FALLBACK_MODEL_API_KEY: ${AUTOLAVA_FALLBACK_MODEL_API_KEY:-}
      AUTOLAVA_AGENT_EVIDENCE_BATCH_LIMIT: ${AUTOLAVA_AGENT_EVIDENCE_BATCH_LIMIT:-1}
      AUTOLAVA_AGENT_RELEASE_REPORT_PATH: ${AUTOLAVA_AGENT_RELEASE_REPORT_PATH:-}
    volumes:
      - autolava_data:/data
  autolava-web:
    image: ${AUTOLAVA_WEB_IMAGE:-autolava-web:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prebuilt
    restart: unless-stopped
    ports:
      - "${AUTOLAVA_WEB_HOST_PORT:-127.0.0.1:80}:80"
    depends_on:
      - autolava-api

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  autolava_data:
