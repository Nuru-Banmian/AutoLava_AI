name: Build release images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and verify locked release images
        run: bash scripts/build-release-images.sh "$RUNNER_TEMP/release-evidence"
      - name: Save prebuilt images
        run: |
          revision=$(git rev-parse HEAD)
          docker save -o "$RUNNER_TEMP/autolava-api.tar" "autolava-api:$revision"
          docker save -o "$RUNNER_TEMP/autolava-web.tar" "autolava-web:$revision"
      - uses: actions/upload-artifact@v7
        with:
          name: autolava-release-images-${{ github.sha }}
          path: |
            ${{ runner.temp }}/autolava-api.tar
            ${{ runner.temp }}/autolava-web.tar
            ${{ runner.temp }}/release-evidence/
          retention-days: 7
