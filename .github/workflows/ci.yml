name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTOLAVA_DATABASE_PATH: /tmp/autolava-ci.sqlite3
      AUTOLAVA_JWT_SECRET: ci-only-jwt-secret-with-at-least-32-bytes
      AUTOLAVA_MODEL_ADAPTER: fake
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate database migrations
        run: python -m alembic upgrade head

      - name: Lint
        run: python -m ruff check .

      - name: Run Agent safety release veto gate
        run: python -m pytest -m agent_release_gate --strict-markers

      - name: Test
        run: python -m pytest -n 2 --dist loadscope --cov=app --cov-report=term-missing

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate Agent release Playwright coverage
        run: npm run test:agent-release-manifest

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
