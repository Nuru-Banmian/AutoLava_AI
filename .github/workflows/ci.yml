name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AUTOLAVA_DATABASE_PATH: /tmp/autolava-ci.sqlite3
  AUTOLAVA_JWT_SECRET: ci-only-jwt-secret-with-at-least-32-bytes
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Validate database migrations
        run: uv run --frozen alembic upgrade head

      - name: Lint
        run: uv run --frozen ruff check .

  backend-core:
    name: Backend core tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run backend tests
        run: >-
          uv run --frozen pytest
          -n 2
          --dist loadscope
          --cov=app
          --cov-report=

      - name: Preserve core coverage
        run: mv .coverage .coverage.core

      - name: Upload core coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-core
          path: backend/.coverage.core
          include-hidden-files: true
          retention-days: 1

  frontend-unit-build:
    name: Frontend unit and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  frontend-e2e:
    name: Frontend end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - backend-quality
      - backend-core
      - frontend-unit-build
      - frontend-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        if: ${{ needs.backend-core.result == 'success' }}
        uses: actions/checkout@v7

      - name: Set up Python
        if: ${{ needs.backend-core.result == 'success' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        if: ${{ needs.backend-core.result == 'success' }}
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        if: ${{ needs.backend-core.result == 'success' }}
        working-directory: backend
        run: uv sync --locked --extra dev

      - name: Download backend coverage
        if: ${{ needs.backend-core.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: backend-coverage-*
          path: backend
          merge-multiple: true

      - name: Enforce combined backend coverage
        if: ${{ needs.backend-core.result == 'success' }}
        working-directory: backend
        run: |
          uv run --frozen coverage combine
          uv run --frozen coverage report --fail-under=85

      - name: Require every CI lane
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json
          import os
          import sys

          results = {
              name: lane["result"]
              for name, lane in json.loads(os.environ["NEEDS_JSON"]).items()
          }
          print(json.dumps(results, sort_keys=True))
          sys.exit(0 if all(result == "success" for result in results.values()) else 1)
