name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AUTOLAVA_DATABASE_PATH: /tmp/autolava-ci-migrations.sqlite3
  AUTOLAVA_JWT_SECRET: ci-only-jwt-secret-with-at-least-32-bytes
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  api-contract:
    name: OpenAPI contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked API dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Install locked web dependencies
        working-directory: frontend
        run: npm ci
      - name: Reject OpenAPI drift
        working-directory: backend
        run: uv run --frozen python -m scripts.export_openapi --check
      - name: Generate frontend types
        working-directory: frontend
        run: npm run generate:api-types
      - name: Reject generated type drift
        run: git diff --exit-code -- frontend/src/api/openapi.json frontend/src/api/generated.ts frontend/src/api/weather-values.ts

  backend-acceptance:
    name: HTTP business acceptance and backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Lint backend and CI gate
        run: uv run --frozen ruff check . ../scripts/ci_gate.py
      - name: Validate database migrations
        run: uv run --frozen alembic upgrade head
      - name: Run independent HTTP and SSE acceptance
        run: uv run --frozen pytest acceptance -q --durations=10 --junitxml=acceptance-results.xml
      - name: Upload acceptance diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: http-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/acceptance-results.xml
            /tmp/pytest-of-runner/pytest-current/acceptance*/server.log
          if-no-files-found: ignore
          retention-days: 7

  browser-acceptance:
    name: Production build and desktop/narrow acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked API dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Install locked web dependencies
        working-directory: frontend
        run: npm ci
      - name: Build production bundle and typecheck
        working-directory: frontend
        run: npm run build
      - name: Install locked Chromium
        working-directory: frontend
        run: npm exec playwright install -- --with-deps chromium
      - name: Run new business browser acceptance against real API
        working-directory: frontend
        run: npm run test:acceptance
      - name: Upload browser diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/acceptance-results
            frontend/acceptance-report
          if-no-files-found: ignore
          retention-days: 7

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [api-contract, backend-acceptance, browser-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Require successful completion of every lane
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_gate.py
