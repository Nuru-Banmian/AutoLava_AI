name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AUTOLAVA_MODEL_ADAPTER: fake
  AUTOLAVA_JWT_SECRET: ci-only-jwt-secret-with-at-least-32-bytes
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend-static:
    name: Backend static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: npm run verify:ci:backend-static

  backend-agent:
    name: Agent backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Run Agent tests and the release veto gate once
        run: npm run verify:ci:backend-agent
      - run: mv backend/.coverage backend/.coverage.agent
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-agent
          path: backend/.coverage.agent
          include-hidden-files: true
          retention-days: 1

  backend-non-agent:
    name: Non-Agent backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Run non-Agent tests without release veto duplication
        run: npm run verify:ci:backend-non-agent
      - run: mv backend/.coverage backend/.coverage.non-agent
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-non-agent
          path: backend/.coverage.non-agent
          include-hidden-files: true
          retention-days: 1

  frontend-unit-build:
    name: Frontend unit and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm run verify:ci:frontend-unit
        working-directory: .

  frontend-e2e:
    name: Frontend end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run end-to-end tests without retaining browser attachments
        run: npm run verify:ci:frontend-e2e
        working-directory: .
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: playwright-results.xml
      - name: Reduce diagnostics to aggregate counts
        if: ${{ failure() && !cancelled() }}
        run: npm run redact:e2e-diagnostics
      - name: Upload aggregate-only Playwright diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/redacted-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  ci-summary:
    name: CI summary
    if: ${{ always() }}
    needs:
      - backend-static
      - backend-agent
      - backend-non-agent
      - frontend-unit-build
      - frontend-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --project backend --frozen --extra dev
      - uses: actions/download-artifact@v8
        with:
          pattern: backend-coverage-*
          path: backend
          merge-multiple: true
      - name: Merge coverage and enforce the overall floor
        working-directory: backend
        run: |
          uv run coverage combine
          uv run coverage report --fail-under=85
      - name: Require every deterministic lane
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json
          import os
          import sys

          results = {
              name: lane["result"]
              for name, lane in json.loads(os.environ["NEEDS_JSON"]).items()
          }
          print(json.dumps(results, sort_keys=True))
          sys.exit(0 if all(result == "success" for result in results.values()) else 1)
